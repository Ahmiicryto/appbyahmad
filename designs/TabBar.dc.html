<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width:390px;height:84px;box-sizing:border-box;padding:8px 10px 20px;display:flex;justify-content:space-around;align-items:flex-start;background:{{t.bar}};border-top:1px solid {{t.line}};font-family:Manrope,system-ui,sans-serif;backdrop-filter:blur(16px)">
  <a href="{{h.today}}" aria-current="{{cur.today}}" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:48px;text-decoration:none;font-size:11px;font-weight:700;color:{{c.today}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    <span>Today</span>
    <span style="width:4px;height:4px;border-radius:2px;background:{{d.today}}"></span>
  </a>
  <a href="{{h.goals}}" aria-current="{{cur.goals}}" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:48px;text-decoration:none;font-size:11px;font-weight:700;color:{{c.goals}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>
    <span>Goals</span>
    <span style="width:4px;height:4px;border-radius:2px;background:{{d.goals}}"></span>
  </a>
  <a href="{{h.life}}" aria-current="{{cur.life}}" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:48px;text-decoration:none;font-size:11px;font-weight:700;color:{{c.life}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg>
    <span>Life</span>
    <span style="width:4px;height:4px;border-radius:2px;background:{{d.life}}"></span>
  </a>
  <a href="{{h.progress}}" aria-current="{{cur.progress}}" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:48px;text-decoration:none;font-size:11px;font-weight:700;color:{{c.progress}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M11 20V5M17 20v-6M3 20h18"></path></svg>
    <span>Progress</span>
    <span style="width:4px;height:4px;border-radius:2px;background:{{d.progress}}"></span>
  </a>
  <a href="{{h.assistant}}" aria-current="{{cur.assistant}}" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:48px;text-decoration:none;font-size:11px;font-weight:700;color:{{c.assistant}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z"></path><path d="M18.5 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
    <span>Assistant</span>
    <span style="width:4px;height:4px;border-radius:2px;background:{{d.assistant}}"></span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"active":{"editor":"enum","options":["today","goals","life","progress","assistant"],"default":"today"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const all = {
      male: {bar:"rgba(9,12,10,0.92)",line:"#253029",muted:"#9AAAA0",ink:"#4ADE80"},
      female: {bar:"rgba(12,9,10,0.92)",line:"#35252B",muted:"#BCA4AB",ink:"#F2849E"},
      neutral: {bar:"rgba(255,255,255,0.94)",line:"#E1E1E4",muted:"#55555E",ink:"#0A0A0A"}
    };
    const theme = this.props.theme || "male";
    const t = all[theme] || all.male;
    const active = this.props.active || "today";
    const p = theme === "female" ? "Female-" : "";
    const files = { today: "Today", goals: "Goals", life: "Money", progress: "Review", assistant: "Assistant" };
    const h = {}, c = {}, d = {}, cur = {};
    Object.keys(files).forEach((k) => {
      const on = k === active;
      h[k] = p + files[k] + ".dc.html";
      c[k] = on ? t.ink : t.muted;
      d[k] = on ? t.ink : "transparent";
      cur[k] = on ? "page" : "false";
    });
    return { t, h, c, d, cur };
  }
}
</script>
</body>
</html>
