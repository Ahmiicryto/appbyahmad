<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Premium — Unlock your full plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes lo-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lo-draw{from{stroke-dashoffset:100}}
@keyframes lo-grow{from{transform:scaleX(0)}}
@keyframes lo-up{from{transform:scaleY(0)}}
@keyframes lo-pulse{0%,100%{box-shadow:0 0 0 0 var(--g)}60%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes lo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lo-shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes lo-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes lo-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes lo-orbit{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;padding:52px 20px 24px;display:flex;flex-direction:column;gap:16px;background:{{t.bg}};color:{{t.text}};font-family:Manrope,system-ui,sans-serif">
  <div style="display:flex;justify-content:flex-end">
    <a href="{{p}}Today.dc.html" aria-label="Close" style="width:44px;height:44px;box-sizing:border-box;border-radius:14px;border:1px solid {{t.line}};background:{{t.s1}};color:{{t.text}};display:flex;align-items:center;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div aria-hidden="true" style="position:relative;width:96px;height:96px;align-self:center">
    <div style="position:absolute;inset:0;border-radius:48px;border:1.5px dashed {{t.line}};animation:lo-orbit 18s linear infinite"></div>
    <span style="position:absolute;top:-4px;left:44px;width:8px;height:8px;border-radius:4px;background:{{t.ink}};transform-origin:4px 52px;animation:lo-orbit 6s linear infinite"></span>
    <div style="--g:{{t.glow}};position:absolute;inset:16px;border-radius:22px;background:{{t.acc}};color:{{t.onAcc}};display:flex;align-items:center;justify-content:center;animation:lo-float 3.2s ease-in-out infinite,lo-pulse 3.2s ease-in-out infinite">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l4 10h12l4-10-6 4-4-7-4 7z"></path></svg>
    </div>
  </div>

  <div style="text-align:center;animation:lo-rise .6s .1s cubic-bezier(.2,.8,.2,1) both">
    <p style="margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:{{t.ink}}">Premium</p>
    <h1 style="margin:6px 0 0;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em">Unlock your full life plan</h1>
    <p style="margin:8px 0 0;font-size:14px;line-height:1.5;color:{{t.muted}}">Goals, money, fitness and career, all in one plan that adapts with you.</p>
  </div>

  <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px">
    <sc-for list="{{feats}}" as="f" hint-placeholder-count="6">
      <li style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{f.d}}">
        <span aria-hidden="true" style="width:22px;height:22px;flex:none;border-radius:11px;background:{{t.soft}};color:{{t.ink}};display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg></span>
        {{f.l}}
      </li>
    </sc-for>
  </ul>

  <div role="radiogroup" aria-label="Plan" style="display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{plans}}" as="pl" hint-placeholder-count="2">
      <button role="radio" aria-checked="{{pl.sel}}" onClick="{{pl.pick}}" style="position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;border-radius:18px;border:1.5px solid {{pl.bd}};background:{{pl.bg}};color:{{t.text}};font:inherit;text-align:left;cursor:pointer;transition:all .3s ease">
        <span aria-hidden="true" style="width:22px;height:22px;flex:none;box-sizing:border-box;border-radius:11px;border:2px solid {{pl.ring}};display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:5px;background:{{pl.dot}};transition:background .3s"></span></span>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:800">{{pl.name}}</span><span style="font-size:12px;color:{{t.muted}}">{{pl.sub}}</span></span>
        <span style="font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700">{{pl.price}}</span>
        <sc-if value="{{pl.best}}" hint-placeholder-val="{{false}}">
          <span style="position:absolute;top:-10px;right:14px;padding:3px 8px;border-radius:999px;background:{{t.acc}};color:{{t.onAcc}};font-size:11px;font-weight:800">Best value</span>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="flex:1"></div>
  <button style="--g:{{t.glow}};position:relative;overflow:hidden;height:56px;flex:none;border-radius:18px;border:0;background:{{t.acc}};color:{{t.onAcc}};font:inherit;font-size:17px;font-weight:800;cursor:pointer;animation:lo-pulse 2.4s ease-in-out infinite">
    Start 7-day free trial
    <span aria-hidden="true" style="position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.3),rgba(255,255,255,0));animation:lo-shine 3s 1s ease-in-out infinite"></span>
  </button>
  <p style="margin:-6px 0 0;text-align:center;font-size:12px;color:{{t.muted}}">{{fine}}</p>
  <div style="display:flex;justify-content:center;gap:4px;font-size:12px">
    <button style="min-height:32px;padding:0 8px;border:0;background:transparent;color:{{t.muted}};font:inherit;font-weight:700;cursor:pointer">Restore purchases</button>
    <a href="#" style="min-height:32px;padding:0 8px;display:flex;align-items:center;color:{{t.muted}};font-weight:700">Terms</a>
    <a href="#" style="min-height:32px;padding:0 8px;display:flex;align-items:center;color:{{t.muted}};font-weight:700">Privacy</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      male: {bg:"#090C0A",s1:"#111713",s2:"#18211B",line:"#253029",text:"#EEF4EF",muted:"#9AAAA0",acc:"#22C55E",onAcc:"#03140A",ink:"#4ADE80",soft:"rgba(74,222,128,0.10)",glow:"rgba(34,197,94,0.45)",track:"#1F2A23",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      female: {bg:"#0C090A",s1:"#171012",s2:"#21161A",line:"#35252B",text:"#F6EEF0",muted:"#BCA4AB",acc:"#9B1C3A",onAcc:"#FFFFFF",ink:"#F2849E",soft:"rgba(242,132,158,0.10)",glow:"rgba(194,38,79,0.5)",track:"#2B1E22",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      neutral: {bg:"#FFFFFF",s1:"#F4F4F5",s2:"#EAEAEC",line:"#E1E1E4",text:"#0A0A0A",muted:"#55555E",acc:"#0A0A0A",onAcc:"#FFFFFF",ink:"#0A0A0A",soft:"rgba(10,10,10,0.05)",glow:"rgba(10,10,10,0.25)",track:"#E4E4E7",c2:"#9A6A12",c3:"#1F6FB2",c4:"#6B46C1",bad:"#C53030"}
    };
  }
  renderVals() {
    const theme = this.props.theme || "male";
    const t = this.themes()[theme] || this.themes().male;
    const p = theme === "female" ? "Female-" : "";
    const st = this.state || {};
    const pick = st.plan == null ? 0 : st.plan;
    const feats = [
      "Unlimited goals with full AI planning",
      "Plans that adapt when life changes",
      "Full Money, Fitness and Nutrition",
      "Career Guide, Future Me and Decisions",
      "Weekly and monthly life reviews",
      "No ads, ever"
    ].map((l, i) => ({ l, d: (0.2 + i * 0.05) + "s" }));
    const defs = [
      { name: "Yearly", sub: "$7.50/month · save 42%", price: "$89.99", best: true, fine: "Free for 7 days, then $89.99/year. Cancel anytime in Settings." },
      { name: "Monthly", sub: "Billed every month", price: "$12.99", best: false, fine: "Free for 7 days, then $12.99/month. Cancel anytime in Settings." }
    ];
    const plans = defs.map((d, i) => {
      const sel = i === pick;
      return { name: d.name, sub: d.sub, price: d.price, best: d.best, sel: sel ? "true" : "false", bd: sel ? t.ink : t.line, bg: sel ? t.soft : t.s1, ring: sel ? t.ink : t.line, dot: sel ? t.ink : "transparent", pick: () => this.setState({ plan: i }) };
    });
    return { t, p, feats, plans, fine: defs[pick].fine };
  }
}
</script>
</body>
</html>
