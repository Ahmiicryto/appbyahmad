<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitness — Today's workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes lo-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lo-draw{from{stroke-dashoffset:100}}
@keyframes lo-grow{from{transform:scaleX(0)}}
@keyframes lo-up{from{transform:scaleY(0)}}
@keyframes lo-pulse{0%,100%{box-shadow:0 0 0 0 var(--g)}60%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes lo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lo-shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes lo-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes lo-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{t.bg}};color:{{t.text}};font-family:Manrope,system-ui,sans-serif">
  <main style="position:absolute;left:0;right:0;top:0;bottom:84px;box-sizing:border-box;padding:56px 20px 12px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <nav aria-label="Life areas" style="display:flex;gap:6px;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <a href="{{c.href}}" aria-current="{{c.cur}}" style="flex:1;height:36px;border-radius:12px;border:1px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none">{{c.label}}</a>
      </sc-for>
    </nav>

    <header style="display:flex;justify-content:space-between;align-items:flex-end;animation:lo-rise .5s .05s cubic-bezier(.2,.8,.2,1) both">
      <div>
        <p style="margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:{{t.ink}}">Today's workout</p>
        <h1 style="margin:4px 0 0;font-size:28px;font-weight:800;letter-spacing:-.02em">Push Day</h1>
        <p style="margin:2px 0 0;font-size:13px;color:{{t.muted}}">45 min · 6 exercises · 18:00</p>
      </div>
      <span style="padding:6px 10px;border-radius:999px;background:{{t.soft}};color:{{t.ink}};font-size:12px;font-weight:800">Week 3 of 8</span>
    </header>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;animation:lo-rise .6s .1s cubic-bezier(.2,.8,.2,1) both">
      <div style="padding:12px;border-radius:18px;background:{{t.s1}};border:1px solid {{t.line}};display:flex;flex-direction:column;gap:6px">
        <svg width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="Steps 78 percent of goal"><circle cx="18" cy="18" r="14" fill="none" stroke="{{t.track}}" stroke-width="4.5"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="{{t.c3}}" stroke-width="4.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="22" transform="rotate(-90 18 18)" style="animation:lo-draw 1.2s .3s cubic-bezier(.2,.8,.2,1) both"></circle></svg>
        <span style="font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700">7,842</span>
        <span style="font-size:11px;color:{{t.muted}}">Steps · goal 10K</span>
      </div>
      <div style="padding:12px;border-radius:18px;background:{{t.s1}};border:1px solid {{t.line}};display:flex;flex-direction:column;gap:6px">
        <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><path d="M4 26 L11 20 L17 23 L24 13 L32 9" fill="none" stroke="{{t.ink}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" style="animation:lo-draw 1.4s .35s ease-out both"></path></svg>
        <span style="font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700">80.4 kg</span>
        <span style="font-size:11px;color:{{t.ink}};font-weight:700">−1.6 kg this month</span>
      </div>
      <div style="padding:12px;border-radius:18px;background:{{t.s1}};border:1px solid {{t.line}};display:flex;flex-direction:column;gap:6px">
        <div aria-hidden="true" style="height:36px;display:flex;align-items:flex-end;gap:4px">
          <span style="width:6px;height:40%;border-radius:2px;background:{{t.c4}};transform-origin:bottom;animation:lo-up .8s .3s cubic-bezier(.2,.8,.2,1) both"></span>
          <span style="width:6px;height:55%;border-radius:2px;background:{{t.c4}};transform-origin:bottom;animation:lo-up .8s .38s cubic-bezier(.2,.8,.2,1) both"></span>
          <span style="width:6px;height:50%;border-radius:2px;background:{{t.c4}};transform-origin:bottom;animation:lo-up .8s .46s cubic-bezier(.2,.8,.2,1) both"></span>
          <span style="width:6px;height:72%;border-radius:2px;background:{{t.c4}};transform-origin:bottom;animation:lo-up .8s .54s cubic-bezier(.2,.8,.2,1) both"></span>
          <span style="width:6px;height:90%;border-radius:2px;background:{{t.c4}};transform-origin:bottom;animation:lo-up .8s .62s cubic-bezier(.2,.8,.2,1) both"></span>
        </div>
        <span style="font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700">+8%</span>
        <span style="font-size:11px;color:{{t.muted}}">Strength · 4 weeks</span>
      </div>
    </div>

    <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ex}}" as="e" hint-placeholder-count="6">
        <li style="display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border-radius:16px;background:{{t.s1}};border:1px solid {{t.line}};animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{e.d}}">
          <span aria-hidden="true" style="width:40px;height:40px;flex:none;border-radius:12px;background:{{t.s2}};color:{{t.ink}};display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px">{{e.n}}</span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:14px;font-weight:800">{{e.name}}</span>
            <span style="font-size:12px;color:{{t.muted}}">{{e.sets}}</span>
          </span>
          <button aria-label="{{e.aria}}" style="width:44px;height:44px;flex:none;border-radius:22px;border:1px solid {{t.line}};background:{{t.s2}};color:{{t.text}};display:flex;align-items:center;justify-content:center;cursor:pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          </button>
        </li>
      </sc-for>
    </ol>

    <button style="--g:{{t.glow}};height:52px;flex:none;border-radius:18px;border:0;background:{{t.acc}};color:{{t.onAcc}};font:inherit;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;animation:lo-pulse 2.4s ease-in-out infinite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
      Start workout
    </button>
  </main>
  <div style="position:absolute;left:0;right:0;bottom:0;height:84px">
    <dc-import name="TabBar" theme="{{theme}}" active="life" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      male: {bg:"#090C0A",s1:"#111713",s2:"#18211B",line:"#253029",text:"#EEF4EF",muted:"#9AAAA0",acc:"#22C55E",onAcc:"#03140A",ink:"#4ADE80",soft:"rgba(74,222,128,0.10)",glow:"rgba(34,197,94,0.45)",track:"#1F2A23",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      female: {bg:"#0C090A",s1:"#171012",s2:"#21161A",line:"#35252B",text:"#F6EEF0",muted:"#BCA4AB",acc:"#9B1C3A",onAcc:"#FFFFFF",ink:"#F2849E",soft:"rgba(242,132,158,0.10)",glow:"rgba(194,38,79,0.5)",track:"#2B1E22",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      neutral: {bg:"#FFFFFF",s1:"#F4F4F5",s2:"#EAEAEC",line:"#E1E1E4",text:"#0A0A0A",muted:"#55555E",acc:"#0A0A0A",onAcc:"#FFFFFF",ink:"#0A0A0A",soft:"rgba(10,10,10,0.05)",glow:"rgba(10,10,10,0.25)",track:"#E4E4E7",c2:"#9A6A12",c3:"#1F6FB2",c4:"#6B46C1",bad:"#C53030"}
    };
  }
  renderVals() {
    const theme = this.props.theme || "male";
    const t = this.themes()[theme] || this.themes().male;
    const p = theme === "female" ? "Female-" : "";
    const active = "Fitness";
    const chips = [["Money", "Money"], ["Fitness", "Fitness"], ["Food", "Nutrition"], ["Career", "Career"], ["Journal", "Journal"]].map((c) => {
      const on = c[0] === active;
      return { label: c[0], href: p + c[1] + ".dc.html", cur: on ? "page" : "false", bd: on ? t.acc : t.line, bg: on ? t.acc : t.s1, fg: on ? t.onAcc : t.text };
    });
    const ex = [
      ["Bench press", "4 sets × 8–10 · Rest 90s"],
      ["Incline dumbbell press", "3 sets × 10–12 · Rest 75s"],
      ["Shoulder press", "3 sets × 8–10 · Rest 75s"],
      ["Lateral raises", "3 sets × 12–15 · Rest 60s"],
      ["Triceps pushdown", "3 sets × 12 · Rest 60s"],
      ["Overhead extension", "3 sets × 12 · Rest 60s"]
    ].map((e, i) => ({ n: i + 1, name: e[0], sets: e[1], aria: "Watch " + e[0] + " demo", d: (0.18 + i * 0.06) + "s" }));
    return { t, theme, chips, ex };
  }
}
</script>
</body>
</html>
