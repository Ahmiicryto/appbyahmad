<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adaptive check-in — What happened?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes lo-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lo-draw{from{stroke-dashoffset:100}}
@keyframes lo-grow{from{transform:scaleX(0)}}
@keyframes lo-up{from{transform:scaleY(0)}}
@keyframes lo-pulse{0%,100%{box-shadow:0 0 0 0 var(--g)}60%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes lo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lo-shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes lo-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes lo-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;padding:56px 20px 28px;display:flex;flex-direction:column;gap:16px;background:{{t.bg}};color:{{t.text}};font-family:Manrope,system-ui,sans-serif">
  <header style="display:flex;align-items:center;justify-content:space-between">
    <a href="{{p}}Goals.dc.html" aria-label="Close" style="width:44px;height:44px;box-sizing:border-box;border-radius:14px;border:1px solid {{t.line}};background:{{t.s1}};color:{{t.text}};display:flex;align-items:center;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-size:14px;font-weight:800">Weekly check-in</span>
    <span style="width:44px"></span>
  </header>

  <div style="display:flex;align-items:center;gap:16px;animation:lo-rise .6s cubic-bezier(.2,.8,.2,1) both">
    <div role="img" aria-label="2 of 5 workouts done" style="position:relative;width:88px;height:88px;flex:none">
      <svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="36" fill="none" stroke="{{t.track}}" stroke-width="9"></circle><circle cx="44" cy="44" r="36" fill="none" stroke="{{t.c3}}" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="60" transform="rotate(-90 44 44)" style="animation:lo-draw 1.3s .2s cubic-bezier(.2,.8,.2,1) both"></circle></svg>
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700">2/5</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:{{t.c3}}">Fitness · Oct 21–27</span>
      <span style="font-size:15px;line-height:1.4;color:{{t.muted}}">You planned 5 workouts and finished 2.</span>
    </div>
  </div>

  <div style="animation:lo-rise .6s .08s cubic-bezier(.2,.8,.2,1) both">
    <h1 style="margin:0;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em">What happened this week?</h1>
    <p style="margin:8px 0 0;font-size:15px;line-height:1.5;color:{{t.muted}}">No judgment. Tell us what got in the way and we'll adjust next week's plan.</p>
  </div>

  <div role="radiogroup" aria-label="Reason" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
    <sc-for list="{{reasons}}" as="r" hint-placeholder-count="6">
      <button role="radio" aria-checked="{{r.sel}}" onClick="{{r.pick}}" style="min-height:48px;padding:10px 12px;border-radius:14px;border:1.5px solid {{r.bd}};background:{{r.bg}};color:{{r.fg}};font:inherit;font-size:14px;font-weight:700;text-align:left;cursor:pointer;transition:all .25s ease;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{r.d}}">{{r.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{hasPick}}" hint-placeholder-val="{{true}}">
    <section aria-live="polite" style="padding:16px;border-radius:22px;background:{{t.s1}};border:1px solid {{t.ink}};display:flex;flex-direction:column;gap:12px;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both">
      <div style="display:flex;align-items:center;gap:8px;color:{{t.ink}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation:lo-float 2.4s ease-in-out infinite"><path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z"></path></svg>
        <span style="font-size:13px;font-weight:800">Suggested for next week</span>
      </div>
      <sc-for list="{{rows}}" as="w" hint-placeholder-count="3">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:14px">
          <span style="color:{{t.muted}}">{{w.k}}</span>
          <span style="font-weight:800">{{w.v}}</span>
        </div>
      </sc-for>
      <p style="margin:0;font-size:13px;line-height:1.5;color:{{t.muted}}">{{why}}</p>
    </section>
  </sc-if>

  <div style="flex:1"></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <a href="{{p}}Goals.dc.html" style="height:52px;border-radius:16px;border:1px solid {{t.line}};background:{{t.s1}};color:{{t.text}};font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none">Keep my plan</a>
    <a href="{{p}}Goals.dc.html" style="--g:{{t.glow}};height:52px;border-radius:16px;background:{{t.acc}};color:{{t.onAcc}};font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none;animation:lo-pulse 2.4s ease-in-out infinite">Apply changes</a>
  </div>
  <p style="margin:-4px 0 0;text-align:center;font-size:12px;color:{{t.muted}}">You can undo this anytime from Goals.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      male: {bg:"#090C0A",s1:"#111713",s2:"#18211B",line:"#253029",text:"#EEF4EF",muted:"#9AAAA0",acc:"#22C55E",onAcc:"#03140A",ink:"#4ADE80",soft:"rgba(74,222,128,0.10)",glow:"rgba(34,197,94,0.45)",track:"#1F2A23",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      female: {bg:"#0C090A",s1:"#171012",s2:"#21161A",line:"#35252B",text:"#F6EEF0",muted:"#BCA4AB",acc:"#9B1C3A",onAcc:"#FFFFFF",ink:"#F2849E",soft:"rgba(242,132,158,0.10)",glow:"rgba(194,38,79,0.5)",track:"#2B1E22",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      neutral: {bg:"#FFFFFF",s1:"#F4F4F5",s2:"#EAEAEC",line:"#E1E1E4",text:"#0A0A0A",muted:"#55555E",acc:"#0A0A0A",onAcc:"#FFFFFF",ink:"#0A0A0A",soft:"rgba(10,10,10,0.05)",glow:"rgba(10,10,10,0.25)",track:"#E4E4E7",c2:"#9A6A12",c3:"#1F6FB2",c4:"#6B46C1",bad:"#C53030"}
    };
  }
  renderVals() {
    const theme = this.props.theme || "male";
    const t = this.themes()[theme] || this.themes().male;
    const p = theme === "female" ? "Female-" : "";
    const st = this.state || {};
    const pick = st.r == null ? 0 : st.r;
    const defs = [
      { label: "Too busy", rows: [["Workouts", "5 → 3 a week"], ["Length", "60 → 45 min"], ["Time", "Evenings → 7:00 AM"]], why: "Three shorter sessions fit a busy week better than five you skip." },
      { label: "I was sick", rows: [["Workouts", "5 → 2 light walks"], ["Intensity", "Rest and recover"], ["Full plan", "Back next Monday"]], why: "Recovery comes first. We'll ease you back in." },
      { label: "Lost motivation", rows: [["Workouts", "5 → 3 a week"], ["Accountability", "Invite a friend"], ["Streak reward", "At 3 in a row"]], why: "Smaller wins rebuild momentum faster than a big plan." },
      { label: "Plan was too hard", rows: [["Weights", "10% lighter"], ["Sets", "4 → 3 per exercise"], ["Length", "60 → 40 min"]], why: "We'll build back up as your strength numbers improve." },
      { label: "Schedule changed", rows: [["Days", "Mon/Wed/Fri → Tue/Thu/Sat"], ["Time", "Moved to 7:00 AM"], ["Length", "Stays 45 min"]], why: "Your calendar now shows free mornings on these days." },
      { label: "Something else", rows: [["Workouts", "5 → 4 a week"], ["Check-in", "Mid-week nudge"], ["Length", "Stays 45 min"]], why: "Tell the Assistant more and we'll fine-tune it." }
    ];
    const reasons = defs.map((d, i) => {
      const sel = i === pick;
      return { label: d.label, sel: sel ? "true" : "false", bd: sel ? t.ink : t.line, bg: sel ? t.soft : t.s1, fg: sel ? t.ink : t.text, d: (0.12 + i * 0.05) + "s", pick: () => this.setState({ r: i }) };
    });
    const cur = defs[pick];
    return { t, p, reasons, hasPick: true, rows: cur.rows.map((r) => ({ k: r[0], v: r[1] })), why: cur.why };
  }
}
</script>
</body>
</html>
