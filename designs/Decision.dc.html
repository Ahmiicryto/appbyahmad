<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decision assistant — Compare options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes lo-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lo-draw{from{stroke-dashoffset:100}}
@keyframes lo-grow{from{transform:scaleX(0)}}
@keyframes lo-up{from{transform:scaleY(0)}}
@keyframes lo-pulse{0%,100%{box-shadow:0 0 0 0 var(--g)}60%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes lo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lo-shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes lo-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes lo-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{t.bg}};color:{{t.text}};font-family:Manrope,system-ui,sans-serif">
  <main style="position:absolute;left:0;right:0;top:0;bottom:84px;box-sizing:border-box;padding:56px 20px 12px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <header style="display:flex;align-items:center;gap:12px;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both">
      <a href="{{p}}Assistant.dc.html" aria-label="Back to Assistant" style="width:44px;height:44px;flex:none;box-sizing:border-box;border-radius:14px;border:1px solid {{t.line}};background:{{t.s1}};color:{{t.text}};display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <h1 style="margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em">Help me decide</h1>
    </header>

    <div style="display:flex;flex-direction:column;gap:6px;animation:lo-rise .5s .05s cubic-bezier(.2,.8,.2,1) both">
      <label for="q" style="font-size:12px;font-weight:800;color:{{t.muted}}">Your decision</label>
      <input id="q" value="Should I take the new job offer?" style="height:48px;box-sizing:border-box;padding:0 14px;border-radius:14px;border:1px solid {{t.line}};background:{{t.s1}};color:{{t.text}};font:inherit;font-size:15px;font-weight:700;outline:none">
    </div>

    <div style="border-radius:20px;background:{{t.s1}};border:1px solid {{t.line}};overflow:hidden;animation:lo-rise .6s .1s cubic-bezier(.2,.8,.2,1) both">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr style="background:{{t.s2}}">
            <th scope="col" style="text-align:left;padding:10px 12px;font-weight:700;color:{{t.muted}}">Factor</th>
            <th scope="col" style="text-align:left;padding:10px 8px;font-weight:800">A · Stay</th>
            <th scope="col" style="text-align:left;padding:10px 12px 10px 8px;font-weight:800;color:{{t.ink}}">B · New offer</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <tr style="border-top:1px solid {{t.line}};animation:lo-rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{r.d}}">
              <th scope="row" style="text-align:left;padding:9px 12px;font-weight:600;color:{{t.muted}}">{{r.f}}</th>
              <td style="padding:9px 8px;font-weight:{{r.aw}};color:{{r.ac}}">{{r.a}}</td>
              <td style="padding:9px 12px 9px 8px;font-weight:{{r.bw}};color:{{r.bc}}">{{r.b}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>

    <section aria-label="Weighted score" style="display:flex;flex-direction:column;gap:8px;animation:lo-rise .6s .3s cubic-bezier(.2,.8,.2,1) both">
      <div style="display:flex;align-items:center;gap:10px;font-size:13px">
        <span style="width:72px;font-weight:700">A · Stay</span>
        <div style="flex:1;height:10px;border-radius:5px;background:{{t.track}};overflow:hidden"><div style="height:100%;width:62%;border-radius:5px;background:{{t.muted}};transform-origin:left;animation:lo-grow 1.1s .5s cubic-bezier(.2,.8,.2,1) both"></div></div>
        <span style="width:28px;text-align:right;font-family:'Space Grotesk',sans-serif;font-weight:700">62</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;font-size:13px">
        <span style="width:72px;font-weight:800;color:{{t.ink}}">B · Offer</span>
        <div style="flex:1;height:10px;border-radius:5px;background:{{t.track}};overflow:hidden"><div style="height:100%;width:78%;border-radius:5px;background:{{t.ink}};transform-origin:left;animation:lo-grow 1.1s .7s cubic-bezier(.2,.8,.2,1) both"></div></div>
        <span style="width:28px;text-align:right;font-family:'Space Grotesk',sans-serif;font-weight:700;color:{{t.ink}}">78</span>
      </div>
    </section>

    <section aria-label="Recommendation" style="padding:14px;border-radius:20px;background:{{t.soft}};border:1px solid {{t.ink}};display:flex;flex-direction:column;gap:6px;animation:lo-rise .6s .6s cubic-bezier(.2,.8,.2,1) both">
      <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:{{t.ink}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation:lo-float 2.4s ease-in-out infinite"><path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z"></path></svg>
        Based on your profile and goals
      </span>
      <span style="font-size:14px;font-weight:700;line-height:1.45">The new offer fits your goals better. +$1,600 a month moves your house goal 7 months closer.</span>
      <span style="font-size:12px;line-height:1.45;color:{{t.muted}}">Trade-off: a longer commute. We'd move workouts to 7:00 AM to protect them.</span>
    </section>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <button style="height:48px;border-radius:14px;border:1px solid {{t.line}};background:{{t.s1}};color:{{t.text}};font:inherit;font-size:14px;font-weight:800;cursor:pointer">Adjust weights</button>
      <button style="height:48px;border-radius:14px;border:0;background:{{t.acc}};color:{{t.onAcc}};font:inherit;font-size:14px;font-weight:800;cursor:pointer">Save decision</button>
    </div>
  </main>
  <div style="position:absolute;left:0;right:0;bottom:0;height:84px">
    <dc-import name="TabBar" theme="{{theme}}" active="assistant" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      male: {bg:"#090C0A",s1:"#111713",s2:"#18211B",line:"#253029",text:"#EEF4EF",muted:"#9AAAA0",acc:"#22C55E",onAcc:"#03140A",ink:"#4ADE80",soft:"rgba(74,222,128,0.10)",glow:"rgba(34,197,94,0.45)",track:"#1F2A23",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      female: {bg:"#0C090A",s1:"#171012",s2:"#21161A",line:"#35252B",text:"#F6EEF0",muted:"#BCA4AB",acc:"#9B1C3A",onAcc:"#FFFFFF",ink:"#F2849E",soft:"rgba(242,132,158,0.10)",glow:"rgba(194,38,79,0.5)",track:"#2B1E22",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      neutral: {bg:"#FFFFFF",s1:"#F4F4F5",s2:"#EAEAEC",line:"#E1E1E4",text:"#0A0A0A",muted:"#55555E",acc:"#0A0A0A",onAcc:"#FFFFFF",ink:"#0A0A0A",soft:"rgba(10,10,10,0.05)",glow:"rgba(10,10,10,0.25)",track:"#E4E4E7",c2:"#9A6A12",c3:"#1F6FB2",c4:"#6B46C1",bad:"#C53030"}
    };
  }
  renderVals() {
    const theme = this.props.theme || "male";
    const t = this.themes()[theme] || this.themes().male;
    const p = theme === "female" ? "Female-" : "";
    const rows = [
      ["Salary", "$5,200/mo", "$6,800/mo", "b"],
      ["Commute", "20 min", "45 min", "a"],
      ["Growth", "Medium", "High", "b"],
      ["Risk", "Low", "Medium", "a"],
      ["Goal fit", "Medium", "High", "b"],
      ["Long term", "Steady", "Faster", "b"]
    ].map((r, i) => ({
      f: r[0], a: r[1], b: r[2],
      aw: r[3] === "a" ? "800" : "500", ac: r[3] === "a" ? t.text : t.muted,
      bw: r[3] === "b" ? "800" : "500", bc: r[3] === "b" ? t.ink : t.muted,
      d: (0.15 + i * 0.05) + "s"
    }));
    return { t, theme, p, rows };
  }
}
</script>
</body>
</html>
