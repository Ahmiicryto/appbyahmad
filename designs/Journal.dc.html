<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journal — How are you feeling?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes lo-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lo-draw{from{stroke-dashoffset:100}}
@keyframes lo-grow{from{transform:scaleX(0)}}
@keyframes lo-up{from{transform:scaleY(0)}}
@keyframes lo-pulse{0%,100%{box-shadow:0 0 0 0 var(--g)}60%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes lo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lo-shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes lo-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes lo-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{t.bg}};color:{{t.text}};font-family:Manrope,system-ui,sans-serif">
  <main style="position:absolute;left:0;right:0;top:0;bottom:84px;box-sizing:border-box;padding:56px 20px 12px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <nav aria-label="Life areas" style="display:flex;gap:6px;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <a href="{{c.href}}" aria-current="{{c.cur}}" style="flex:1;height:36px;border-radius:12px;border:1px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none">{{c.label}}</a>
      </sc-for>
    </nav>

    <h1 style="margin:0;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.02em;animation:lo-rise .5s .05s cubic-bezier(.2,.8,.2,1) both">How are you feeling today?</h1>

    <div role="radiogroup" aria-label="Mood" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px">
      <sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
        <button role="radio" aria-checked="{{m.sel}}" onClick="{{m.pick}}" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:16px;border:1.5px solid {{m.bd}};background:{{m.bg}};color:{{m.fg}};font:inherit;font-size:11px;font-weight:800;cursor:pointer;transition:all .3s cubic-bezier(.2,.8,.2,1);transform:{{m.scale}};animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{m.d}}">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="15" cy="15" r="12"></circle><circle cx="11" cy="12.5" r="1" fill="currentColor"></circle><circle cx="19" cy="12.5" r="1" fill="currentColor"></circle><path d="{{m.mouth}}"></path></svg>
          {{m.label}}
        </button>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:20px;background:{{t.s1}};border:1px solid {{t.line}};animation:lo-rise .6s .2s cubic-bezier(.2,.8,.2,1) both">
      <label for="entry" style="font-size:12px;font-weight:800;color:{{t.muted}}">Today's entry</label>
      <textarea id="entry" rows="4" placeholder="Write freely. Only you can see this." style="resize:none;border:0;outline:none;background:transparent;color:{{t.text}};font:inherit;font-size:15px;line-height:1.5;padding:0">Long day, but I finally finished the landing page draft. Felt proud walking home.</textarea>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:{{t.muted}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          Private · Face ID lock on
        </span>
        <button style="--g:{{t.glow}};height:40px;padding:0 16px;border-radius:12px;border:0;background:{{t.acc}};color:{{t.onAcc}};font:inherit;font-size:14px;font-weight:800;cursor:pointer;animation:lo-pulse 2.4s ease-in-out infinite">Save entry</button>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h2 style="margin:0;font-size:16px;font-weight:800">Past entries</h2>
      <span style="font-size:12px;color:{{t.muted}}">42 entries</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:14px;background:{{t.s1}};border:1px solid {{t.line}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" aria-label="Search entries" placeholder="Search your entries" style="flex:1;border:0;outline:none;background:transparent;color:{{t.text}};font:inherit;font-size:14px">
    </div>
    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
        <li style="display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:{{t.s1}};border:1px solid {{t.line}};animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{e.d}}">
          <span aria-hidden="true" style="width:10px;height:10px;flex:none;margin-top:5px;border-radius:5px;background:{{e.col}}"></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:12px;font-weight:800;color:{{t.muted}}">{{e.date}} · {{e.mood}}</span>
            <span style="font-size:13px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{e.text}}</span>
          </span>
        </li>
      </sc-for>
    </ul>
  </main>
  <div style="position:absolute;left:0;right:0;bottom:0;height:84px">
    <dc-import name="TabBar" theme="{{theme}}" active="life" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      male: {bg:"#090C0A",s1:"#111713",s2:"#18211B",line:"#253029",text:"#EEF4EF",muted:"#9AAAA0",acc:"#22C55E",onAcc:"#03140A",ink:"#4ADE80",soft:"rgba(74,222,128,0.10)",glow:"rgba(34,197,94,0.45)",track:"#1F2A23",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      female: {bg:"#0C090A",s1:"#171012",s2:"#21161A",line:"#35252B",text:"#F6EEF0",muted:"#BCA4AB",acc:"#9B1C3A",onAcc:"#FFFFFF",ink:"#F2849E",soft:"rgba(242,132,158,0.10)",glow:"rgba(194,38,79,0.5)",track:"#2B1E22",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      neutral: {bg:"#FFFFFF",s1:"#F4F4F5",s2:"#EAEAEC",line:"#E1E1E4",text:"#0A0A0A",muted:"#55555E",acc:"#0A0A0A",onAcc:"#FFFFFF",ink:"#0A0A0A",soft:"rgba(10,10,10,0.05)",glow:"rgba(10,10,10,0.25)",track:"#E4E4E7",c2:"#9A6A12",c3:"#1F6FB2",c4:"#6B46C1",bad:"#C53030"}
    };
  }
  renderVals() {
    const theme = this.props.theme || "male";
    const t = this.themes()[theme] || this.themes().male;
    const p = theme === "female" ? "Female-" : "";
    const active = "Journal";
    const chips = [["Money", "Money"], ["Fitness", "Fitness"], ["Food", "Nutrition"], ["Career", "Career"], ["Journal", "Journal"]].map((c) => {
      const on = c[0] === active;
      return { label: c[0], href: p + c[1] + ".dc.html", cur: on ? "page" : "false", bd: on ? t.acc : t.line, bg: on ? t.acc : t.s1, fg: on ? t.onAcc : t.text };
    });
    const st = this.state || {};
    const pick = st.m == null ? 1 : st.m;
    const defs = [
      ["Happy", "M10 18c2.5 3 7.5 3 10 0"],
      ["Good", "M11 18.5c2 1.5 6 1.5 8 0"],
      ["Neutral", "M11 19h8"],
      ["Sad", "M10.5 20.5c2.5-2.5 6.5-2.5 9 0"],
      ["Stressed", "M10 19.5l2-1.5 2 1.5 2-1.5 2 1.5 2-1.5"]
    ];
    const moods = defs.map((m, i) => {
      const sel = i === pick;
      return { label: m[0], mouth: m[1], sel: sel ? "true" : "false", bd: sel ? t.ink : t.line, bg: sel ? t.soft : t.s1, fg: sel ? t.ink : t.muted, scale: sel ? "scale(1.06)" : "scale(1)", d: (0.1 + i * 0.05) + "s", pick: () => this.setState({ m: i }) };
    });
    const entries = [
      ["Oct 27", "Happy", t.ink, "Signed my first client call for next week. Nervous but excited."],
      ["Oct 26", "Stressed", t.c2, "Too many things at once. Need to say no more often."],
      ["Oct 25", "Good", t.c3, "Morning workout felt great. Slept 8 hours for once."]
    ].map((e, i) => ({ date: e[0], mood: e[1], col: e[2], text: e[3], d: (0.35 + i * 0.07) + "s" }));
    return { t, theme, chips, moods, entries };
  }
}
</script>
</body>
</html>
