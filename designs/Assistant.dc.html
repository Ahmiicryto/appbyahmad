<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assistant — Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes lo-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lo-draw{from{stroke-dashoffset:100}}
@keyframes lo-grow{from{transform:scaleX(0)}}
@keyframes lo-up{from{transform:scaleY(0)}}
@keyframes lo-pulse{0%,100%{box-shadow:0 0 0 0 var(--g)}60%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes lo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lo-shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes lo-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes lo-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes lo-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{t.bg}};color:{{t.text}};font-family:Manrope,system-ui,sans-serif">
  <main style="position:absolute;left:0;right:0;top:0;bottom:84px;box-sizing:border-box;padding:56px 20px 12px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
    <header style="display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid {{t.line}};animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both">
      <span aria-hidden="true" style="--g:{{t.glow}};width:44px;height:44px;flex:none;border-radius:14px;background:{{t.acc}};color:{{t.onAcc}};display:flex;align-items:center;justify-content:center;animation:lo-pulse 3s ease-in-out infinite">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:lo-spin 12s linear infinite"><path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z"></path><path d="M18.5 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"></path></svg>
      </span>
      <div>
        <h1 style="margin:0;font-size:20px;font-weight:800">Assistant</h1>
        <p style="margin:2px 0 0;font-size:12px;color:{{t.muted}}">Knows your goals, money, fitness and schedule</p>
      </div>
    </header>

    <div role="log" aria-label="Conversation" style="flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden">
      <div style="align-self:flex-end;max-width:78%;padding:10px 14px;border-radius:18px 18px 4px 18px;background:{{t.acc}};color:{{t.onAcc}};font-size:14px;font-weight:600;line-height:1.45;animation:lo-rise .5s .1s cubic-bezier(.2,.8,.2,1) both">I only have 30 minutes today. Can you change my workout?</div>

      <div style="align-self:flex-start;max-width:88%;display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:18px 18px 18px 4px;background:{{t.s1}};border:1px solid {{t.line}};animation:lo-rise .5s .45s cubic-bezier(.2,.8,.2,1) both">
        <span style="font-size:14px;line-height:1.45">Done. Here's a 30-minute Push Day that keeps your weekly volume on track:</span>
        <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px">
          <sc-for list="{{plan}}" as="x" hint-placeholder-count="4">
            <li style="display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:10px;background:{{t.s2}};font-size:13px"><span style="font-weight:700">{{x.n}}</span><span style="color:{{t.muted}};font-family:'Space Grotesk',sans-serif">{{x.s}}</span></li>
          </sc-for>
        </ul>
        <button style="align-self:flex-start;height:36px;padding:0 14px;border-radius:12px;border:0;background:{{t.acc}};color:{{t.onAcc}};font:inherit;font-size:13px;font-weight:800;cursor:pointer">Use this workout</button>
      </div>

      <div style="align-self:flex-end;max-width:78%;padding:10px 14px;border-radius:18px 18px 4px 18px;background:{{t.acc}};color:{{t.onAcc}};font-size:14px;font-weight:600;line-height:1.45;animation:lo-rise .5s .9s cubic-bezier(.2,.8,.2,1) both">Can I afford a $120 jacket this month?</div>

      <div aria-label="Assistant is typing" style="align-self:flex-start;display:flex;gap:5px;padding:14px 16px;border-radius:18px 18px 18px 4px;background:{{t.s1}};border:1px solid {{t.line}};animation:lo-rise .5s 1.2s cubic-bezier(.2,.8,.2,1) both">
        <span style="width:7px;height:7px;border-radius:4px;background:{{t.ink}};animation:lo-blink 1.2s 0s ease-in-out infinite"></span>
        <span style="width:7px;height:7px;border-radius:4px;background:{{t.ink}};animation:lo-blink 1.2s .2s ease-in-out infinite"></span>
        <span style="width:7px;height:7px;border-radius:4px;background:{{t.ink}};animation:lo-blink 1.2s .4s ease-in-out infinite"></span>
      </div>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button style="height:36px;padding:0 12px;border-radius:999px;border:1px solid {{t.line}};background:{{t.s1}};color:{{t.text}};font:inherit;font-size:12px;font-weight:700;cursor:pointer">What should I focus on today?</button>
      <button style="height:36px;padding:0 12px;border-radius:999px;border:1px solid {{t.line}};background:{{t.s1}};color:{{t.text}};font:inherit;font-size:12px;font-weight:700;cursor:pointer">Am I on track to save?</button>
      <a href="{{p}}Decision.dc.html" style="height:36px;box-sizing:border-box;padding:0 12px;border-radius:999px;border:1px solid {{t.ink}};background:{{t.soft}};color:{{t.ink}};font-size:12px;font-weight:800;display:flex;align-items:center;text-decoration:none">Help me decide</a>
    </div>

    <form style="display:flex;align-items:center;gap:8px;height:52px;box-sizing:border-box;padding:4px 4px 4px 14px;border-radius:18px;background:{{t.s1}};border:1px solid {{t.line}}">
      <input aria-label="Message your assistant" placeholder="Ask anything about your plan" style="flex:1;min-width:0;border:0;outline:none;background:transparent;color:{{t.text}};font:inherit;font-size:14px">
      <button type="button" aria-label="Speak your message" style="width:44px;height:44px;flex:none;border-radius:14px;border:0;background:transparent;color:{{t.muted}};display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </button>
      <button type="button" aria-label="Send" style="width:44px;height:44px;flex:none;border-radius:14px;border:0;background:{{t.acc}};color:{{t.onAcc}};display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </form>
  </main>
  <div style="position:absolute;left:0;right:0;bottom:0;height:84px">
    <dc-import name="TabBar" theme="{{theme}}" active="assistant" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      male: {bg:"#090C0A",s1:"#111713",s2:"#18211B",line:"#253029",text:"#EEF4EF",muted:"#9AAAA0",acc:"#22C55E",onAcc:"#03140A",ink:"#4ADE80",soft:"rgba(74,222,128,0.10)",glow:"rgba(34,197,94,0.45)",track:"#1F2A23",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      female: {bg:"#0C090A",s1:"#171012",s2:"#21161A",line:"#35252B",text:"#F6EEF0",muted:"#BCA4AB",acc:"#9B1C3A",onAcc:"#FFFFFF",ink:"#F2849E",soft:"rgba(242,132,158,0.10)",glow:"rgba(194,38,79,0.5)",track:"#2B1E22",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      neutral: {bg:"#FFFFFF",s1:"#F4F4F5",s2:"#EAEAEC",line:"#E1E1E4",text:"#0A0A0A",muted:"#55555E",acc:"#0A0A0A",onAcc:"#FFFFFF",ink:"#0A0A0A",soft:"rgba(10,10,10,0.05)",glow:"rgba(10,10,10,0.25)",track:"#E4E4E7",c2:"#9A6A12",c3:"#1F6FB2",c4:"#6B46C1",bad:"#C53030"}
    };
  }
  renderVals() {
    const theme = this.props.theme || "male";
    const t = this.themes()[theme] || this.themes().male;
    const p = theme === "female" ? "Female-" : "";
    const plan = [["Bench press", "3 × 8"], ["Shoulder press", "3 × 10"], ["Push-ups", "2 × max"], ["Triceps dips", "2 × 12"]].map((x) => ({ n: x[0], s: x[1] }));
    return { t, theme, p, plan };
  }
}
</script>
</body>
</html>
