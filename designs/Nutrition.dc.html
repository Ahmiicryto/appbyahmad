<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nutrition — Meal plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes lo-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lo-draw{from{stroke-dashoffset:100}}
@keyframes lo-grow{from{transform:scaleX(0)}}
@keyframes lo-up{from{transform:scaleY(0)}}
@keyframes lo-pulse{0%,100%{box-shadow:0 0 0 0 var(--g)}60%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes lo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lo-shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes lo-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes lo-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{t.bg}};color:{{t.text}};font-family:Manrope,system-ui,sans-serif">
  <main style="position:absolute;left:0;right:0;top:0;bottom:84px;box-sizing:border-box;padding:56px 20px 12px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <nav aria-label="Life areas" style="display:flex;gap:6px;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <a href="{{c.href}}" aria-current="{{c.cur}}" style="flex:1;height:36px;border-radius:12px;border:1px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none">{{c.label}}</a>
      </sc-for>
    </nav>

    <header style="display:flex;justify-content:space-between;align-items:center;animation:lo-rise .5s .05s cubic-bezier(.2,.8,.2,1) both">
      <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em">Meal plan</h1>
      <div role="tablist" aria-label="Range" style="display:flex;padding:3px;border-radius:12px;background:{{t.s1}};border:1px solid {{t.line}}">
        <button role="tab" aria-selected="true" style="height:32px;padding:0 10px;border-radius:9px;border:0;background:{{t.s2}};color:{{t.text}};font:inherit;font-size:12px;font-weight:800;cursor:pointer">Today</button>
        <button role="tab" aria-selected="false" style="height:32px;padding:0 10px;border-radius:9px;border:0;background:transparent;color:{{t.muted}};font:inherit;font-size:12px;font-weight:700;cursor:pointer">Week</button>
        <button role="tab" aria-selected="false" style="height:32px;padding:0 10px;border-radius:9px;border:0;background:transparent;color:{{t.muted}};font:inherit;font-size:12px;font-weight:700;cursor:pointer">Recipes</button>
      </div>
    </header>

    <section aria-label="Calories and macros" style="padding:16px;border-radius:22px;background:{{t.s1}};border:1px solid {{t.line}};display:flex;gap:16px;align-items:center;animation:lo-rise .6s .1s cubic-bezier(.2,.8,.2,1) both">
      <div role="img" aria-label="1,850 of 2,200 calories eaten" style="position:relative;width:116px;height:116px;flex:none">
        <svg width="116" height="116" viewBox="0 0 116 116" aria-hidden="true"><circle cx="58" cy="58" r="48" fill="none" stroke="{{t.track}}" stroke-width="11"></circle><circle cx="58" cy="58" r="48" fill="none" stroke="{{t.ink}}" stroke-width="11" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="16" transform="rotate(-90 58 58)" style="animation:lo-draw 1.4s .25s cubic-bezier(.2,.8,.2,1) both"></circle></svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <span style="font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;line-height:1">1,850</span>
          <span style="font-size:11px;color:{{t.muted}};margin-top:3px">of 2,200 kcal</span>
          <span style="font-size:11px;font-weight:800;color:{{t.ink}};margin-top:2px">350 left</span>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;gap:4px">
            <div style="display:flex;justify-content:space-between;font-size:12px"><span style="font-weight:800">{{m.l}}</span><span style="color:{{t.muted}};font-family:'Space Grotesk',sans-serif">{{m.v}}</span></div>
            <div style="height:6px;border-radius:3px;background:{{t.track}};overflow:hidden"><div style="height:100%;width:{{m.w}};border-radius:3px;background:{{m.col}};transform-origin:left;animation:lo-grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{m.d}}"></div></div>
          </div>
        </sc-for>
      </div>
    </section>

    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{meals}}" as="f" hint-placeholder-count="4">
        <li style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:{{t.s1}};border:1px solid {{t.line}};animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{f.d}}">
          <span aria-hidden="true" style="width:52px;height:52px;flex:none;border-radius:14px;background:{{t.s2}};color:{{f.col}};display:flex;align-items:center;justify-content:center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="animation:lo-float 3s ease-in-out infinite;animation-delay:{{f.d}}"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"></path></svg>
          </span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:12px;font-weight:800;color:{{f.col}}">{{f.meal}} · {{f.kcal}}</span>
            <span style="font-size:14px;font-weight:700;line-height:1.3">{{f.dish}}</span>
            <span style="font-size:11px;color:{{t.muted}};font-family:'Space Grotesk',sans-serif">{{f.mac}}</span>
          </span>
          <button aria-label="{{f.aria}}" style="height:36px;padding:0 12px;border-radius:12px;border:1px solid {{t.line}};background:{{t.s2}};color:{{t.text}};font:inherit;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:4px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l4 4-4 4"></path><path d="M3 7h18"></path><path d="M7 21l-4-4 4-4"></path><path d="M21 17H3"></path></svg>
            Swap
          </button>
        </li>
      </sc-for>
    </ul>

    <a href="#" style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:{{t.soft}};border:1px solid {{t.line}};color:{{t.text}};text-decoration:none;animation:lo-rise .6s .5s cubic-bezier(.2,.8,.2,1) both">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 7H6"></path></svg>
      <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:800">Your grocery list is ready</span><span style="font-size:12px;color:{{t.muted}}">18 items for this week's meals</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </main>
  <div style="position:absolute;left:0;right:0;bottom:0;height:84px">
    <dc-import name="TabBar" theme="{{theme}}" active="life" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      male: {bg:"#090C0A",s1:"#111713",s2:"#18211B",line:"#253029",text:"#EEF4EF",muted:"#9AAAA0",acc:"#22C55E",onAcc:"#03140A",ink:"#4ADE80",soft:"rgba(74,222,128,0.10)",glow:"rgba(34,197,94,0.45)",track:"#1F2A23",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      female: {bg:"#0C090A",s1:"#171012",s2:"#21161A",line:"#35252B",text:"#F6EEF0",muted:"#BCA4AB",acc:"#9B1C3A",onAcc:"#FFFFFF",ink:"#F2849E",soft:"rgba(242,132,158,0.10)",glow:"rgba(194,38,79,0.5)",track:"#2B1E22",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      neutral: {bg:"#FFFFFF",s1:"#F4F4F5",s2:"#EAEAEC",line:"#E1E1E4",text:"#0A0A0A",muted:"#55555E",acc:"#0A0A0A",onAcc:"#FFFFFF",ink:"#0A0A0A",soft:"rgba(10,10,10,0.05)",glow:"rgba(10,10,10,0.25)",track:"#E4E4E7",c2:"#9A6A12",c3:"#1F6FB2",c4:"#6B46C1",bad:"#C53030"}
    };
  }
  renderVals() {
    const theme = this.props.theme || "male";
    const t = this.themes()[theme] || this.themes().male;
    const p = theme === "female" ? "Female-" : "";
    const active = "Food";
    const chips = [["Money", "Money"], ["Fitness", "Fitness"], ["Food", "Nutrition"], ["Career", "Career"], ["Journal", "Journal"]].map((c) => {
      const on = c[0] === active;
      return { label: c[0], href: p + c[1] + ".dc.html", cur: on ? "page" : "false", bd: on ? t.acc : t.line, bg: on ? t.acc : t.s1, fg: on ? t.onAcc : t.text };
    });
    const macros = [["Protein", 120, 160, t.c3], ["Carbs", 180, 230, t.c2], ["Fat", 50, 70, t.c4]].map((m, i) => ({
      l: m[0], v: m[1] + " / " + m[2] + " g", w: Math.round(m[1] / m[2] * 100) + "%", col: m[3], d: (0.35 + i * 0.1) + "s"
    }));
    const meals = [
      ["Breakfast", "450 kcal", "Oatmeal with banana and whey", "P 32g · C 60g · F 9g", t.c2],
      ["Lunch", "650 kcal", "Grilled chicken, rice and greens", "P 48g · C 70g · F 16g", t.ink],
      ["Dinner", "600 kcal", "Salmon, quinoa and broccoli", "P 40g · C 45g · F 22g", t.c3],
      ["Snack", "150 kcal", "Greek yogurt with berries", "P 15g · C 14g · F 3g", t.c4]
    ].map((f, i) => ({ meal: f[0], kcal: f[1], dish: f[2], mac: f[3], col: f[4], aria: "Swap " + f[0].toLowerCase(), d: (0.2 + i * 0.07) + "s" }));
    return { t, theme, chips, macros, meals };
  }
}
</script>
</body>
</html>
