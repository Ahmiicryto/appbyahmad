<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Future Me — Your vision</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes lo-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lo-draw{from{stroke-dashoffset:100}}
@keyframes lo-grow{from{transform:scaleX(0)}}
@keyframes lo-up{from{transform:scaleY(0)}}
@keyframes lo-pulse{0%,100%{box-shadow:0 0 0 0 var(--g)}60%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes lo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lo-shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes lo-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes lo-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes lo-sunrise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{t.bg}};color:{{t.text}};font-family:Manrope,system-ui,sans-serif">
  <main style="position:absolute;left:0;right:0;top:0;bottom:84px;display:flex;flex-direction:column;overflow:hidden">
    <div style="position:relative;height:290px;flex:none;overflow:hidden;background:{{t.sky}}">
      <svg width="390" height="290" viewBox="0 0 390 290" aria-hidden="true" style="position:absolute;inset:0">
        <g fill="{{t.text}}">
          <circle cx="40" cy="70" r="1.4" style="animation:lo-twinkle 3s 0s ease-in-out infinite"></circle>
          <circle cx="92" cy="40" r="1" style="animation:lo-twinkle 2.6s .6s ease-in-out infinite"></circle>
          <circle cx="150" cy="88" r="1.2" style="animation:lo-twinkle 3.4s 1.1s ease-in-out infinite"></circle>
          <circle cx="210" cy="34" r="1.5" style="animation:lo-twinkle 2.8s .3s ease-in-out infinite"></circle>
          <circle cx="262" cy="76" r="1" style="animation:lo-twinkle 3.1s 1.5s ease-in-out infinite"></circle>
          <circle cx="318" cy="48" r="1.3" style="animation:lo-twinkle 2.5s .9s ease-in-out infinite"></circle>
          <circle cx="356" cy="96" r="1" style="animation:lo-twinkle 3.6s .2s ease-in-out infinite"></circle>
          <circle cx="120" cy="130" r="1" style="animation:lo-twinkle 2.9s 1.8s ease-in-out infinite"></circle>
          <circle cx="300" cy="128" r="1.2" style="animation:lo-twinkle 3.3s 1.2s ease-in-out infinite"></circle>
        </g>
        <g style="animation:lo-sunrise 1.8s .2s cubic-bezier(.2,.8,.2,1) both">
          <circle cx="195" cy="200" r="96" fill="{{t.ink}}" opacity="0.06"></circle>
          <circle cx="195" cy="200" r="72" fill="{{t.ink}}" opacity="0.10"></circle>
          <circle cx="195" cy="200" r="50" fill="{{t.ink}}" opacity="0.9"></circle>
        </g>
        <path d="M0 230 L60 190 L110 214 L170 168 L230 210 L290 178 L350 206 L390 190 L390 290 L0 290 Z" fill="{{t.s2}}"></path>
        <path d="M0 252 L80 226 L150 244 L210 222 L280 246 L340 230 L390 240 L390 290 L0 290 Z" fill="{{t.s1}}"></path>
        <g style="animation:lo-float 4s ease-in-out infinite">
          <circle cx="195" cy="214" r="6" fill="{{t.bg}}"></circle>
          <path d="M187 240 Q195 220 203 240 L201 252 L189 252 Z" fill="{{t.bg}}"></path>
        </g>
        <path d="M0 270 L390 270 L390 290 L0 290 Z" fill="{{t.bg}}"></path>
      </svg>
      <button style="position:absolute;top:52px;right:20px;height:36px;padding:0 14px;border-radius:12px;border:1px solid {{t.line}};background:{{t.bar}};color:{{t.text}};font:inherit;font-size:13px;font-weight:800;cursor:pointer">Edit</button>
      <div style="position:absolute;left:20px;bottom:22px;animation:lo-rise .7s .4s cubic-bezier(.2,.8,.2,1) both">
        <p style="margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:{{t.ink}}">Future Me</p>
        <h1 style="margin:4px 0 0;font-size:30px;font-weight:800;letter-spacing:-.02em">December 2027 Me</h1>
      </div>
    </div>

    <div style="flex:1;box-sizing:border-box;padding:4px 20px 12px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
      <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px">
        <sc-for list="{{targets}}" as="g" hint-placeholder-count="7">
          <li style="display:flex;align-items:center;gap:10px;min-height:40px;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{g.d}}">
            <span style="width:68px;font-size:13px;color:{{t.muted}}">{{g.l}}</span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
              <span style="display:flex;justify-content:space-between;gap:6px;font-size:13px"><span style="color:{{t.muted}}">{{g.now}}</span><span style="font-weight:800">{{g.goal}}</span></span>
              <span style="display:block;height:5px;border-radius:3px;background:{{t.track}};overflow:hidden"><span style="display:block;height:100%;width:{{g.w}};border-radius:3px;background:{{g.col}};transform-origin:left;animation:lo-grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{g.d2}}"></span></span>
            </span>
          </li>
        </sc-for>
      </ul>

      <section aria-label="Overall progress" style="padding:16px;border-radius:22px;background:{{t.s1}};border:1px solid {{t.ink}};display:flex;flex-direction:column;gap:10px;animation:lo-rise .6s .7s cubic-bezier(.2,.8,.2,1) both">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
          <span style="font-size:15px;font-weight:800;line-height:1.35">You're 43% of the way to the person you described.</span>
          <span style="font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:{{t.ink}}">43%</span>
        </div>
        <div style="position:relative;height:10px;border-radius:5px;background:{{t.track}};overflow:hidden">
          <div style="position:relative;height:100%;width:43%;border-radius:5px;background:{{t.ink}};overflow:hidden;transform-origin:left;animation:lo-grow 1.4s .9s cubic-bezier(.2,.8,.2,1) both">
            <span style="position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));animation:lo-shine 2.6s 2.2s ease-in-out infinite"></span>
          </div>
        </div>
        <span style="font-size:12px;color:{{t.muted}}">Up 5% since last month. Your goals update when you edit this.</span>
      </section>
    </div>
  </main>
  <div style="position:absolute;left:0;right:0;bottom:0;height:84px">
    <dc-import name="TabBar" theme="{{theme}}" active="goals" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      male: {bg:"#090C0A",s1:"#111713",s2:"#18211B",line:"#253029",text:"#EEF4EF",muted:"#9AAAA0",acc:"#22C55E",onAcc:"#03140A",ink:"#4ADE80",soft:"rgba(74,222,128,0.10)",glow:"rgba(34,197,94,0.45)",track:"#1F2A23",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171",sky:"#0D1410",bar:"rgba(9,12,10,0.7)"},
      female: {bg:"#0C090A",s1:"#171012",s2:"#21161A",line:"#35252B",text:"#F6EEF0",muted:"#BCA4AB",acc:"#9B1C3A",onAcc:"#FFFFFF",ink:"#F2849E",soft:"rgba(242,132,158,0.10)",glow:"rgba(194,38,79,0.5)",track:"#2B1E22",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171",sky:"#140C0F",bar:"rgba(12,9,10,0.7)"},
      neutral: {bg:"#FFFFFF",s1:"#F4F4F5",s2:"#EAEAEC",line:"#E1E1E4",text:"#0A0A0A",muted:"#55555E",acc:"#0A0A0A",onAcc:"#FFFFFF",ink:"#0A0A0A",soft:"rgba(10,10,10,0.05)",glow:"rgba(10,10,10,0.25)",track:"#E4E4E7",c2:"#9A6A12",c3:"#1F6FB2",c4:"#6B46C1",bad:"#C53030",sky:"#F7F7F8",bar:"rgba(255,255,255,0.8)"}
    };
  }
  renderVals() {
    const theme = this.props.theme || "male";
    const t = this.themes()[theme] || this.themes().male;
    const targets = [
      ["Weight", "82 kg", "75 kg", 30, t.c3],
      ["Income", "$5.2K/mo", "$10K/mo", 52, t.c2],
      ["Savings", "$15K", "$50K", 30, t.c2],
      ["Career", "Designer", "Software Engineer", 25, t.c4],
      ["Business", "Building", "Launched", 35, t.ink],
      ["Reading", "12 books", "20 books", 60, t.ink],
      ["Travel", "Saving up", "Japan", 40, t.c3]
    ].map((g, i) => ({ l: g[0], now: g[1], goal: g[2], w: g[3] + "%", col: g[4], d: (0.3 + i * 0.06) + "s", d2: (0.5 + i * 0.06) + "s" }));
    return { t, theme, targets };
  }
}
</script>
</body>
</html>
