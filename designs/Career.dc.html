<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Career — Your roadmap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes lo-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lo-draw{from{stroke-dashoffset:100}}
@keyframes lo-grow{from{transform:scaleX(0)}}
@keyframes lo-up{from{transform:scaleY(0)}}
@keyframes lo-pulse{0%,100%{box-shadow:0 0 0 0 var(--g)}60%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes lo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lo-shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes lo-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes lo-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{t.bg}};color:{{t.text}};font-family:Manrope,system-ui,sans-serif">
  <main style="position:absolute;left:0;right:0;top:0;bottom:84px;box-sizing:border-box;padding:56px 20px 12px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <nav aria-label="Life areas" style="display:flex;gap:6px;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <a href="{{c.href}}" aria-current="{{c.cur}}" style="flex:1;height:36px;border-radius:12px;border:1px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none">{{c.label}}</a>
      </sc-for>
    </nav>

    <header style="display:flex;flex-direction:column;gap:10px;animation:lo-rise .5s .05s cubic-bezier(.2,.8,.2,1) both">
      <div style="display:flex;align-items:center;gap:12px">
        <span aria-hidden="true" style="width:44px;height:44px;flex:none;border-radius:14px;background:{{t.soft}};color:{{t.c4}};display:flex;align-items:center;justify-content:center;animation:lo-float 3s ease-in-out infinite">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>
        </span>
        <div>
          <p style="margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:{{t.c4}}">Career goal</p>
          <h1 style="margin:2px 0 0;font-size:22px;font-weight:800;letter-spacing:-.01em">Become a Financial Analyst</h1>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;height:8px;border-radius:4px;background:{{t.track}};overflow:hidden"><div style="height:100%;width:25%;border-radius:4px;background:{{t.c4}};transform-origin:left;animation:lo-grow 1.1s .3s cubic-bezier(.2,.8,.2,1) both"></div></div>
        <span style="font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700">25%</span>
      </div>
      <p style="margin:0;font-size:13px;color:{{t.muted}}">Step 2 of 8 · about 9 months to go</p>
    </header>

    <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
        <li style="display:flex;align-items:center;gap:12px;padding:8px 12px;min-height:44px;box-sizing:border-box;border-radius:14px;background:{{s.bg}};border:1px solid {{s.bd}};animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{s.d}}">
          <span aria-hidden="true" style="--g:{{t.glow}};width:26px;height:26px;flex:none;box-sizing:border-box;border-radius:13px;border:2px solid {{s.ring}};background:{{s.fill}};color:{{s.numCol}};display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;animation:{{s.anim}}">{{s.n}}</span>
          <span style="flex:1;font-size:14px;font-weight:700">{{s.title}}</span>
          <span style="font-size:12px;font-weight:800;color:{{s.stCol}}">{{s.status}}</span>
        </li>
      </sc-for>
    </ol>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <sc-for list="{{tools}}" as="k" hint-placeholder-count="4">
        <a href="#" style="display:flex;flex-direction:column;gap:6px;padding:12px;min-height:84px;box-sizing:border-box;border-radius:18px;background:{{t.s1}};border:1px solid {{t.line}};color:{{t.text}};text-decoration:none;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{k.d}}">
          <span style="font-size:14px;font-weight:800">{{k.title}}</span>
          <span style="font-size:12px;line-height:1.35;color:{{t.muted}}">{{k.sub}}</span>
        </a>
      </sc-for>
    </div>
  </main>
  <div style="position:absolute;left:0;right:0;bottom:0;height:84px">
    <dc-import name="TabBar" theme="{{theme}}" active="life" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      male: {bg:"#090C0A",s1:"#111713",s2:"#18211B",line:"#253029",text:"#EEF4EF",muted:"#9AAAA0",acc:"#22C55E",onAcc:"#03140A",ink:"#4ADE80",soft:"rgba(74,222,128,0.10)",glow:"rgba(34,197,94,0.45)",track:"#1F2A23",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      female: {bg:"#0C090A",s1:"#171012",s2:"#21161A",line:"#35252B",text:"#F6EEF0",muted:"#BCA4AB",acc:"#9B1C3A",onAcc:"#FFFFFF",ink:"#F2849E",soft:"rgba(242,132,158,0.10)",glow:"rgba(194,38,79,0.5)",track:"#2B1E22",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      neutral: {bg:"#FFFFFF",s1:"#F4F4F5",s2:"#EAEAEC",line:"#E1E1E4",text:"#0A0A0A",muted:"#55555E",acc:"#0A0A0A",onAcc:"#FFFFFF",ink:"#0A0A0A",soft:"rgba(10,10,10,0.05)",glow:"rgba(10,10,10,0.25)",track:"#E4E4E7",c2:"#9A6A12",c3:"#1F6FB2",c4:"#6B46C1",bad:"#C53030"}
    };
  }
  renderVals() {
    const theme = this.props.theme || "male";
    const t = this.themes()[theme] || this.themes().male;
    const p = theme === "female" ? "Female-" : "";
    const active = "Career";
    const chips = [["Money", "Money"], ["Fitness", "Fitness"], ["Food", "Nutrition"], ["Career", "Career"], ["Journal", "Journal"]].map((c) => {
      const on = c[0] === active;
      return { label: c[0], href: p + c[1] + ".dc.html", cur: on ? "page" : "false", bd: on ? t.acc : t.line, bg: on ? t.acc : t.s1, fg: on ? t.onAcc : t.text };
    });
    const defs = [
      ["Learn Excel", "done"], ["Learn financial modelling", "now"], ["Complete a certification", "next"],
      ["Build 3 portfolio projects", "next"], ["Update your résumé", "next"], ["Apply to 10 jobs a week", "next"]
    ];
    const steps = defs.map((s, i) => ({
      n: i + 1, title: s[0],
      status: s[1] === "done" ? "Done" : (s[1] === "now" ? "60%" : "Upcoming"),
      stCol: s[1] === "next" ? t.muted : t.ink,
      ring: s[1] === "next" ? t.line : t.acc,
      fill: s[1] === "done" ? t.acc : "transparent",
      numCol: s[1] === "done" ? t.onAcc : (s[1] === "now" ? t.ink : t.muted),
      bg: s[1] === "now" ? t.soft : t.s1, bd: s[1] === "now" ? t.ink : t.line,
      anim: s[1] === "now" ? "lo-pulse 2s ease-in-out infinite" : "none",
      d: (0.12 + i * 0.06) + "s"
    }));
    const tools = [
      ["Résumé builder", "Last edited 2 days ago"],
      ["Job tracker", "12 applied · 3 interviews"],
      ["Salary research", "$65K–$85K in your city"],
      ["Interview practice", "Practice with AI, get feedback"]
    ].map((k, i) => ({ title: k[0], sub: k[1], d: (0.5 + i * 0.06) + "s" }));
    return { t, theme, chips, steps, tools };
  }
}
</script>
</body>
</html>
