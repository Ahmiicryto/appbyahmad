<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress — Your week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes lo-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lo-draw{from{stroke-dashoffset:100}}
@keyframes lo-grow{from{transform:scaleX(0)}}
@keyframes lo-up{from{transform:scaleY(0)}}
@keyframes lo-pulse{0%,100%{box-shadow:0 0 0 0 var(--g)}60%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes lo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lo-shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes lo-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes lo-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{t.bg}};color:{{t.text}};font-family:Manrope,system-ui,sans-serif">
  <main style="position:absolute;left:0;right:0;top:0;bottom:84px;box-sizing:border-box;padding:56px 20px 12px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <header style="display:flex;justify-content:space-between;align-items:center;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both">
      <div>
        <h1 style="margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em">Your week</h1>
        <p style="margin:2px 0 0;font-size:13px;color:{{t.muted}}">Oct 21–27 · Weekly Life Review</p>
      </div>
      <a href="{{p}}FutureMe.dc.html" style="height:40px;padding:0 12px;border-radius:12px;border:1px solid {{t.line}};background:{{t.s1}};color:{{t.text}};font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;text-decoration:none">Future Me <span style="color:{{t.ink}};font-family:'Space Grotesk',sans-serif">43%</span></a>
    </header>

    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
      <sc-for list="{{rings}}" as="r" hint-placeholder-count="4">
        <div role="img" aria-label="{{r.aria}}" style="display:flex;flex-direction:column;align-items:center;gap:6px;animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{r.d}}">
          <div style="position:relative;width:72px;height:72px">
            <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="29" fill="none" stroke="{{t.track}}" stroke-width="7"></circle><circle cx="36" cy="36" r="29" fill="none" stroke="{{r.col}}" stroke-width="7" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="{{r.off}}" transform="rotate(-90 36 36)" style="animation:lo-draw 1.3s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{r.d2}}"></circle></svg>
            <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700">{{r.v}}%</span>
          </div>
          <span style="font-size:12px;font-weight:700;color:{{t.muted}}">{{r.l}}</span>
        </div>
      </sc-for>
    </div>

    <section aria-label="Daily consistency" style="padding:14px 16px;border-radius:20px;background:{{t.s1}};border:1px solid {{t.line}};display:flex;flex-direction:column;gap:10px;animation:lo-rise .6s .25s cubic-bezier(.2,.8,.2,1) both">
      <div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:800">Daily consistency</span><span style="color:{{t.muted}}">Avg 78%</span></div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:64px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end">
            <span style="width:100%;height:{{b.h}};border-radius:6px;background:{{b.col}};transform-origin:bottom;animation:lo-up .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{b.d}}"></span>
            <span style="font-size:10px;font-weight:700;color:{{t.muted}}">{{b.l}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{insights}}" as="i" hint-placeholder-count="4">
        <li style="display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:{{t.s1}};border:1px solid {{t.line}};animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{i.d}}">
          <span aria-hidden="true" style="width:40px;height:40px;flex:none;border-radius:12px;background:{{t.s2}};color:{{i.col}};display:flex;align-items:center;justify-content:center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.icon}}"></path></svg>
          </span>
          <span style="flex:1;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:{{i.col}}">{{i.k}}</span>
            <span style="font-size:14px;font-weight:700;line-height:1.35">{{i.v}}</span>
          </span>
        </li>
      </sc-for>
    </ul>

    <button style="--g:{{t.glow}};height:52px;flex:none;border-radius:18px;border:0;background:{{t.acc}};color:{{t.onAcc}};font:inherit;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;animation:lo-pulse 2.4s ease-in-out infinite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z"></path></svg>
      Build my next week
    </button>
  </main>
  <div style="position:absolute;left:0;right:0;bottom:0;height:84px">
    <dc-import name="TabBar" theme="{{theme}}" active="progress" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      male: {bg:"#090C0A",s1:"#111713",s2:"#18211B",line:"#253029",text:"#EEF4EF",muted:"#9AAAA0",acc:"#22C55E",onAcc:"#03140A",ink:"#4ADE80",soft:"rgba(74,222,128,0.10)",glow:"rgba(34,197,94,0.45)",track:"#1F2A23",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      female: {bg:"#0C090A",s1:"#171012",s2:"#21161A",line:"#35252B",text:"#F6EEF0",muted:"#BCA4AB",acc:"#9B1C3A",onAcc:"#FFFFFF",ink:"#F2849E",soft:"rgba(242,132,158,0.10)",glow:"rgba(194,38,79,0.5)",track:"#2B1E22",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      neutral: {bg:"#FFFFFF",s1:"#F4F4F5",s2:"#EAEAEC",line:"#E1E1E4",text:"#0A0A0A",muted:"#55555E",acc:"#0A0A0A",onAcc:"#FFFFFF",ink:"#0A0A0A",soft:"rgba(10,10,10,0.05)",glow:"rgba(10,10,10,0.25)",track:"#E4E4E7",c2:"#9A6A12",c3:"#1F6FB2",c4:"#6B46C1",bad:"#C53030"}
    };
  }
  renderVals() {
    const theme = this.props.theme || "male";
    const t = this.themes()[theme] || this.themes().male;
    const p = theme === "female" ? "Female-" : "";
    const rings = [["Goals", 76, t.ink], ["Fitness", 88, t.c3], ["Finance", 64, t.c2], ["Career", 81, t.c4]].map((r, i) => ({
      l: r[0], v: r[1], col: r[2], off: 100 - r[1], aria: r[0] + " " + r[1] + " percent", d: (0.08 + i * 0.07) + "s", d2: (0.2 + i * 0.12) + "s"
    }));
    const bars = [["M", 82], ["T", 90], ["W", 64], ["T", 88], ["F", 71], ["S", 55], ["S", 96]].map((b, i) => ({
      l: b[0], h: b[1] + "%", col: b[1] >= 80 ? t.ink : t.track, d: (0.35 + i * 0.06) + "s"
    }));
    const insights = [
      ["Biggest win", "You worked on your business 5 of 7 days.", t.ink, "M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"],
      ["Biggest problem", "You spent $187 more than planned.", t.bad, "M12 9v4M12 17h.01M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"],
      ["Pattern detected", "Your focus drops after 8 PM.", t.c3, "M3 12h4l3-8 4 16 3-8h4"],
      ["Recommendation", "Move hard tasks to 9–11 AM.", t.c4, "M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z"]
    ].map((x, i) => ({ k: x[0], v: x[1], col: x[2], icon: x[3], d: (0.45 + i * 0.08) + "s" }));
    return { t, theme, p, rings, bars, insights };
  }
}
</script>
</body>
</html>
