<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today — Daily Command Center</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes lo-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lo-draw{from{stroke-dashoffset:100}}
@keyframes lo-grow{from{transform:scaleX(0)}}
@keyframes lo-up{from{transform:scaleY(0)}}
@keyframes lo-pulse{0%,100%{box-shadow:0 0 0 0 var(--g)}60%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
@keyframes lo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lo-shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes lo-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes lo-twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{t.bg}};color:{{t.text}};font-family:Manrope,system-ui,sans-serif">
  <main style="position:absolute;left:0;right:0;top:0;bottom:84px;box-sizing:border-box;padding:56px 20px 12px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <header style="display:flex;align-items:center;gap:12px;animation:lo-rise .6s cubic-bezier(.2,.8,.2,1) both">
      <div aria-hidden="true" style="width:44px;height:44px;flex:none;box-sizing:border-box;border-radius:22px;background:{{t.soft}};border:1.5px solid {{t.ink}};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:{{t.ink}}">H</div>
      <div style="flex:1;min-width:0">
        <h1 style="margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em">Good morning, Hamza</h1>
        <p style="margin:2px 0 0;font-size:13px;color:{{t.muted}}">Tue, Oct 28 · Here's your day.</p>
      </div>
      <button aria-label="Notifications, 2 new" style="position:relative;width:44px;height:44px;flex:none;border-radius:14px;border:1px solid {{t.line}};background:{{t.s1}};color:{{t.text}};display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="--g:{{t.glow}};position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:4px;background:{{t.ink}};animation:lo-pulse 2s ease-in-out infinite"></span>
      </button>
    </header>

    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;animation:lo-rise .6s .05s cubic-bezier(.2,.8,.2,1) both">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;background:{{d.bg}};color:{{d.fg}};border:1px solid {{d.bd}}">
          <span style="font-size:11px;font-weight:700">{{d.w}}</span>
          <span style="font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700">{{d.n}}</span>
          <span style="width:4px;height:4px;border-radius:2px;background:{{d.dot}}"></span>
        </div>
      </sc-for>
    </div>

    <section aria-label="Life Score" style="padding:16px;border-radius:24px;background:{{t.s1}};border:1px solid {{t.line}};display:flex;gap:16px;align-items:center;animation:lo-rise .6s .1s cubic-bezier(.2,.8,.2,1) both">
      <div role="img" aria-label="Life Score 782 of 1000" style="position:relative;width:108px;height:108px;flex:none">
        <svg width="108" height="108" viewBox="0 0 108 108" aria-hidden="true"><circle cx="54" cy="54" r="45" fill="none" stroke="{{t.track}}" stroke-width="10"></circle><circle cx="54" cy="54" r="45" fill="none" stroke="{{t.ink}}" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="22" transform="rotate(-90 54 54)" style="animation:lo-draw 1.4s .2s cubic-bezier(.2,.8,.2,1) both"></circle></svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <span style="font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;line-height:1">{{score}}</span>
          <span style="font-size:11px;color:{{t.muted}};margin-top:3px">of 1000</span>
        </div>
      </div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:14px;font-weight:800">Life Score</span>
          <span style="font-size:12px;font-weight:700;color:{{t.ink}}">+12 this week</span>
        </div>
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:8px;font-size:12px">
            <span style="width:50px;color:{{t.muted}}">{{c.l}}</span>
            <div style="flex:1;height:6px;border-radius:3px;background:{{t.track}};overflow:hidden"><div style="height:100%;width:{{c.w}};border-radius:3px;background:{{c.col}};transform-origin:left;animation:lo-grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{c.d}}"></div></div>
            <span style="width:22px;text-align:right;font-family:'Space Grotesk',sans-serif;font-weight:600">{{c.v}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <div style="display:flex;justify-content:space-between;align-items:baseline;animation:lo-rise .6s .15s cubic-bezier(.2,.8,.2,1) both">
      <h2 style="margin:0;font-size:17px;font-weight:800">Today's priorities</h2>
      <span style="font-size:13px;color:{{t.muted}}">{{doneCount}} of 5 done</span>
    </div>
    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{tasks}}" as="k" hint-placeholder-count="5">
        <li style="animation:lo-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:{{k.d}}">
          <button onClick="{{k.toggle}}" aria-pressed="{{k.pressed}}" style="width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;min-height:52px;box-sizing:border-box;border-radius:16px;border:1px solid {{t.line}};background:{{t.s1}};color:{{t.text}};font:inherit;text-align:left;cursor:pointer">
            <span aria-hidden="true" style="width:24px;height:24px;flex:none;box-sizing:border-box;border-radius:8px;border:2px solid {{k.box}};background:{{k.fill}};display:flex;align-items:center;justify-content:center;transition:all .25s ease">
              <sc-if value="{{k.done}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.onAcc}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg></sc-if>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
              <span style="font-size:14px;font-weight:700;text-decoration:{{k.deco}};color:{{k.tc}};transition:color .25s">{{k.title}}</span>
              <span style="font-size:12px;font-weight:700;color:{{k.col}}">{{k.src}}</span>
            </span>
            <span style="font-size:12px;color:{{t.muted}};font-family:'Space Grotesk',sans-serif">{{k.time}}</span>
          </button>
        </li>
      </sc-for>
    </ul>

    <button style="--g:{{t.glow}};height:52px;flex:none;border-radius:18px;border:0;background:{{t.acc}};color:{{t.onAcc}};font:inherit;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;animation:lo-pulse 2.4s ease-in-out infinite">
      Start my day
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </main>
  <div style="position:absolute;left:0;right:0;bottom:0;height:84px">
    <dc-import name="TabBar" theme="{{theme}}" active="today" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["male","female","neutral"],"default":"male"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      male: {bg:"#090C0A",s1:"#111713",s2:"#18211B",line:"#253029",text:"#EEF4EF",muted:"#9AAAA0",acc:"#22C55E",onAcc:"#03140A",ink:"#4ADE80",soft:"rgba(74,222,128,0.10)",glow:"rgba(34,197,94,0.45)",track:"#1F2A23",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      female: {bg:"#0C090A",s1:"#171012",s2:"#21161A",line:"#35252B",text:"#F6EEF0",muted:"#BCA4AB",acc:"#9B1C3A",onAcc:"#FFFFFF",ink:"#F2849E",soft:"rgba(242,132,158,0.10)",glow:"rgba(194,38,79,0.5)",track:"#2B1E22",c2:"#F5B841",c3:"#5AB8F0",c4:"#B794F6",bad:"#F87171"},
      neutral: {bg:"#FFFFFF",s1:"#F4F4F5",s2:"#EAEAEC",line:"#E1E1E4",text:"#0A0A0A",muted:"#55555E",acc:"#0A0A0A",onAcc:"#FFFFFF",ink:"#0A0A0A",soft:"rgba(10,10,10,0.05)",glow:"rgba(10,10,10,0.25)",track:"#E4E4E7",c2:"#9A6A12",c3:"#1F6FB2",c4:"#6B46C1",bad:"#C53030"}
    };
  }
  componentDidMount() {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    const start = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - start) / 1400);
      const e = 1 - Math.pow(1 - p, 3);
      this.setState({ score: Math.round(782 * e) });
      if (p < 1) this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    const theme = this.props.theme || "male";
    const t = this.themes()[theme] || this.themes().male;
    const st = this.state || {};
    const done = st.done || { 0: true, 1: true };
    const days = [["Sun", 26], ["Mon", 27], ["Tue", 28], ["Wed", 29], ["Thu", 30], ["Fri", 31], ["Sat", 1]].map((x, i) => ({
      w: x[0], n: x[1],
      bg: i === 2 ? t.acc : t.s1, fg: i === 2 ? t.onAcc : t.text, bd: i === 2 ? t.acc : t.line,
      dot: i < 2 ? t.ink : (i === 2 ? t.onAcc : "transparent")
    }));
    const cats = [["Goals", 86, t.ink], ["Money", 72, t.c2], ["Fitness", 81, t.c3], ["Career", 88, t.c4]].map((c, i) => ({
      l: c[0], v: c[1], w: c[1] + "%", col: c[2], d: (0.3 + i * 0.1) + "s"
    }));
    const defs = [
      { title: "Finish landing page", src: "Goal · Business", col: t.ink, time: "9:00" },
      { title: "Push workout · 45 min", src: "Fitness", col: t.c3, time: "18:00" },
      { title: "Spend less than $40", src: "Money", col: t.c2, time: "All day" },
      { title: "Apply to 2 jobs", src: "Career", col: t.c4, time: "20:00" },
      { title: "Read 20 pages", src: "Goal · Reading", col: t.ink, time: "22:00" }
    ];
    const tasks = defs.map((k, i) => {
      const isDone = !!done[i];
      return {
        title: k.title, src: k.src, col: k.col, time: k.time, done: isDone, pressed: isDone ? "true" : "false",
        box: isDone ? t.acc : t.line, fill: isDone ? t.acc : "transparent",
        deco: isDone ? "line-through" : "none", tc: isDone ? t.muted : t.text,
        d: (0.2 + i * 0.06) + "s",
        toggle: () => this.setState({ done: Object.assign({}, done, { [i]: !isDone }) })
      };
    });
    const doneCount = tasks.filter((k) => k.done).length;
    return { t, theme, days, cats, tasks, doneCount, score: st.score == null ? 782 : st.score };
  }
}
</script>
</body>
</html>
